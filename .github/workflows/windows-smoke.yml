name: Native Windows smoke test

on:
  workflow_dispatch:
  push:
    branches: [test/windows-native]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONUTF8: "1"
      HERMES_HOME: ${{ runner.temp }}\hermes-smoke
      HERMES_TIMEZONE: America/New_York
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Native lock contention and exception cleanup
        run: |
          python -m pip install "requests>=2,<3"
          python .github/scripts/windows_smoke.py lock
      - name: Check out Hermes v0.21.6
        uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: 818c13be1dc4fd28987e1e881a9408224afd4535
          path: hermes-host
      - name: Install Hermes
        run: python -m pip install -e ./hermes-host
      - name: Plugin installation, live sync, and gateway scheduling
        run: python .github/scripts/windows_smoke.py integration
      - name: Save diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-smoke-evidence
          path: |
            ${{ runner.temp }}/hermes-smoke/freemodels/*.log
            ${{ runner.temp }}/hermes-smoke/gateway-smoke.log
            ${{ runner.temp }}/hermes-smoke/windows-result.json
          if-no-files-found: ignore
